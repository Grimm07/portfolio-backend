name: Deploy

# Builds the contact-ingest Lambda artifact and hands deployment off to Spacelift,
# implementing a GitOps promotion model where GitHub Actions is the SOLE trigger:
#
#   PR opened/updated -> apply DEV  (auto-deploy)  AND  post a PROD PLAN (preview, no apply)
#   merge to main     -> apply PROD
#
# The prod plan on PRs is a non-applying preview so reviewers see the prod blast radius
# of a change before it merges; the actual prod apply only happens on push to main.
#
# This repo no longer runs `tofu apply` in CI. The backend Terraform is owned by the
# per-account Spacelift stacks `portfolio-backend-dev` / `portfolio-backend-prod`. CI's job is:
#
#   1. Build the Go arm64 `bootstrap` binary (provided.al2023 custom runtime).
#   2. Zip it (bootstrap at the zip root) named by commit SHA: <sha>.zip.
#   3. Upload it to the per-account Lambda artifact bucket (name read from SSM
#      /shadowspire/<env>/lambda-artifacts-bucket), keyed by <sha>.zip.
#   4. Pin the stack's TF_VAR_artifact_key to <sha>.zip and trigger a tracked Spacelift
#      run, blocking on the result so a failed apply fails this job.
#
# Spacelift's own VCS webhooks are ignored for these stacks (companion infra push policy +
# enable_local_preview=true); these CLI/spacectl-triggered runs are unaffected by that policy.
#
#   deploy-dev  (pull_request)         -> apply  DEV  (GitHub Environment "dev",        account 176355979099, stack portfolio-backend-dev)
#   plan-prod   (pull_request)         -> PLAN   PROD (no apply, no AWS OIDC; runs server-side on the prod Spacelift worker)
#   deploy-prod (push: main)           -> apply  PROD (GitHub Environment "production", account 681053994223, stack portfolio-backend-prod)
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ OIDC PREREQUISITE (cross-repo): the `portfolio-deploy` role in each account must      │
# │ trust this repo's OIDC subject (repo:Grimm07/portfolio-backend:environment:dev /      │
# │ :environment:production). It is used HERE only to read the artifact-bucket name from   │
# │ SSM and upload the zip to S3 (the role already has s3:* + /shadowspire SSM read).      │
# │ It is NOT used to apply Terraform — Spacelift's own stack role does the apply.         │
# └─────────────────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege; jobs that assume an AWS role via OIDC opt into id-token: write
# individually. plan-prod runs server-side on the Spacelift worker and needs no OIDC token.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # DEV — feature-branch PRs. OIDC sub = repo:Grimm07/portfolio-backend:environment:dev
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # assume the dev portfolio-deploy role via OIDC
      contents: read
    env:
      ENV: dev
      AWS_ACCOUNT: "176355979099"
      SPACELIFT_STACK: portfolio-backend-dev
      # On pull_request, $GITHUB_SHA is the synthesized merge ref (refs/pull/N/merge),
      # which Spacelift's GitHub App cannot resolve as a tracked commit. HEAD_SHA is the
      # PR branch tip — the commit actions/checkout checks out and we build the artifact
      # from — and the one we pin the dev stack to below. Use it everywhere in this job.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC, dev account)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::176355979099:role/portfolio-deploy
          aws-region: us-east-1

      - name: Build contact Lambda bundle (Go arm64 bootstrap)
        working-directory: backend
        run: make build

      - name: Zip bootstrap at zip root, keyed by SHA
        # provided.al2023 requires the executable named `bootstrap` at the ZIP ROOT; -j junks the path.
        run: ( cd backend && zip -j "../$HEAD_SHA.zip" bootstrap )

      - name: Upload artifact to per-account bucket
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/shadowspire/${ENV}/lambda-artifacts-bucket" \
            --query Parameter.Value --output text)
          aws s3 cp "$HEAD_SHA.zip" "s3://$BUCKET/$HEAD_SHA.zip"

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@e92035013ee29ed401c9d35772b3ab2f4c8d12cd # v2.1.0

      - name: Trigger Spacelift deploy (blocks on run result)
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        run: |
          # Pin the tracked commit to THIS PR's head SHA first, then the artifact key, then deploy.
          #
          # Why the explicit pin: the app stacks carry a GIT_PUSH `ignore { true }` policy
          # (infra spacelift-admin/gitops.tf), so Spacelift never advances the tracked commit
          # from VCS webhooks. Without set-current-commit, `stack deploy` re-runs whatever stale
          # commit Spacelift last recorded — not this PR's code. spacectl/API calls bypass push
          # policies, so this set is honored. We pin to HEAD_SHA (the PR branch tip), NOT
          # $GITHUB_SHA: on pull_request the latter is the refs/pull/N/merge ref, which Spacelift
          # cannot resolve. HEAD_SHA is also the exact commit we built + uploaded the artifact for.
          #
          # Interleave consideration: TF_VAR_artifact_key (and now the tracked commit) is mutable
          # stack state, so in theory two deploys to the SAME stack could race. This is safe here
          # because: (a) Spacelift SERIALIZES tracked runs per stack — the second deploy queues
          # behind the first and re-reads stack state at its own plan time; and (b) GitHub's
          # `concurrency: deploy-${{ github.ref }}` serializes per ref, and dev vs prod target
          # DISTINCT stacks. (Concurrent PRs to dev remain a known constraint — one PR open at a
          # time. See the infra migration runbook.)
          spacectl stack set-current-commit \
            --id "$SPACELIFT_STACK" --sha "$HEAD_SHA"
          spacectl stack environment setvar \
            --id "$SPACELIFT_STACK" TF_VAR_artifact_key "$HEAD_SHA.zip"
          # --auto-confirm CONFIRMS the tracked run (so it proceeds past the unconfirmed
          # state) but does NOT, by itself, guarantee this job blocks on the outcome. --tail
          # is what makes spacectl stream the run log and BLOCK until the run finishes, exiting
          # non-zero if it does not converge — so a failed apply fails this job (no fire-and-forget).
          spacectl stack deploy --id "$SPACELIFT_STACK" --auto-confirm --tail

  # ---------------------------------------------------------------------------
  # PLAN PROD — on every PR, post a NON-APPLYING preview of the PR's change against
  # the prod stack so reviewers see the prod blast radius before merge.
  #
  # This job does NOT build the Go binary, does NOT upload an artifact, and does NOT
  # assume any AWS role: `local-preview` packages the working tree and runs it
  # server-side on the prod Spacelift worker, which already holds the prod stack role.
  # The artifact key is injected for THIS run only via --tf-env-var-override (run-scoped,
  # so it never mutates the stack's pinned TF_VAR_artifact_key — that stays whatever
  # prod last applied). The prod artifact need not exist in the prod bucket for the plan;
  # the plan only needs the variable resolvable.
  #
  # No `environment:` — a plan must run freely on PRs; gating it behind the reviewer-
  # protected "production" environment would block the very preview reviewers rely on.
  # Permissions are contents: read only (no id-token — no OIDC here).
  # local-preview tails by default and exits non-zero on plan failure, so THIS job is
  # the PR's prod-plan status check.
  # ---------------------------------------------------------------------------
  plan-prod:
    name: Plan PROD (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPACELIFT_STACK: portfolio-backend-prod
    steps:
      - uses: actions/checkout@v6

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@e92035013ee29ed401c9d35772b3ab2f4c8d12cd # v2.1.0

      - name: Spacelift local-preview (prod plan, no apply)
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        working-directory: terraform
        run: |
          # --no-find-repository-root: package from THIS dir (terraform/) instead of
          #   walking up to the repo .git root, matching the stack's project_root.
          # --tf-env-var-override: run-scoped TF_VAR_artifact_key, NOT a stack setvar.
          # local-preview tails by default; it exits non-zero on plan failure, making
          # this job the prod-plan check. (No --auto-confirm: previews never apply.)
          spacectl stack local-preview \
            --id "$SPACELIFT_STACK" \
            --tf-env-var-override "artifact_key=${GITHUB_SHA}.zip" \
            --no-find-repository-root

  # ---------------------------------------------------------------------------
  # PROD — pushes to main. OIDC sub = repo:Grimm07/portfolio-backend:environment:production
  # The "production" environment must require reviewers + restrict to the main branch.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy PROD
    # Staged-apply gate (repo idiom, cf. infra custom_domain_active): prod auto-applies on
    # merge ONLY when the repo variable PROD_DEPLOY_ENABLED is set to "true". It is UNSET by
    # default, so merges to main skip the prod apply. This guards the deliberate prod /api
    # Function-URL -> API-Gateway origin cutover: until that migration is done, a clean prod
    # apply would DESTROY the live Function URL prod /api still serves through. Flip the repo
    # variable to "true" only when prod is intentionally ready to converge.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # assume the prod portfolio-deploy role via OIDC
      contents: read
    env:
      ENV: prod
      AWS_ACCOUNT: "681053994223"
      SPACELIFT_STACK: portfolio-backend-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC, prod account)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::681053994223:role/portfolio-deploy
          aws-region: us-east-1

      - name: Build contact Lambda bundle (Go arm64 bootstrap)
        working-directory: backend
        run: make build

      - name: Zip bootstrap at zip root, keyed by SHA
        # provided.al2023 requires the executable named `bootstrap` at the ZIP ROOT; -j junks the path.
        run: ( cd backend && zip -j "../$GITHUB_SHA.zip" bootstrap )

      - name: Upload artifact to per-account bucket
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/shadowspire/${ENV}/lambda-artifacts-bucket" \
            --query Parameter.Value --output text)
          aws s3 cp "$GITHUB_SHA.zip" "s3://$BUCKET/$GITHUB_SHA.zip"

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@e92035013ee29ed401c9d35772b3ab2f4c8d12cd # v2.1.0

      - name: Trigger Spacelift deploy (blocks on run result)
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        run: |
          # Pin the tracked commit to the merged main tip first, then the artifact key, then deploy.
          #
          # Why the explicit pin: the app stacks carry a GIT_PUSH `ignore { true }` policy
          # (infra spacelift-admin/gitops.tf), so Spacelift never advances the tracked commit
          # from the merge push. Without set-current-commit, `stack deploy` re-runs the stale
          # frozen commit instead of this merge. On push:main, $GITHUB_SHA IS the real branch
          # tip (not a refs/pull/N/merge ref), so it resolves and is the commit we built for.
          #
          # Interleave consideration: TF_VAR_artifact_key (and the tracked commit) is mutable
          # stack env, so in theory two deploys to the SAME stack could race. This is safe here
          # because: (a) Spacelift SERIALIZES tracked runs per stack — the second deploy queues
          # behind the first and re-reads stack env at its own plan time; and (b) GitHub's
          # `concurrency: deploy-${{ github.ref }}` already serializes per ref, and dev vs prod
          # target DISTINCT stacks.
          spacectl stack set-current-commit \
            --id "$SPACELIFT_STACK" --sha "$GITHUB_SHA"
          spacectl stack environment setvar \
            --id "$SPACELIFT_STACK" TF_VAR_artifact_key "$GITHUB_SHA.zip"
          # --auto-confirm CONFIRMS the tracked run (so it proceeds past the unconfirmed
          # state) but does NOT, by itself, guarantee this job blocks on the outcome. --tail
          # is what makes spacectl stream the run log and BLOCK until the run finishes, exiting
          # non-zero if it does not converge — so a failed apply fails this job (no fire-and-forget).
          spacectl stack deploy --id "$SPACELIFT_STACK" --auto-confirm --tail
