name: Deploy

# Builds the contact-ingest Lambda artifact and hands deployment off to Spacelift.
#
# This repo no longer runs `tofu apply` in CI. The backend Terraform is owned by the
# per-account Spacelift stacks `portfolio-backend-dev` / `portfolio-backend-prod`. CI's job is:
#
#   1. Build the Go arm64 `bootstrap` binary (provided.al2023 custom runtime).
#   2. Zip it (bootstrap at the zip root) named by commit SHA: <sha>.zip.
#   3. Upload it to the per-account Lambda artifact bucket (name read from SSM
#      /shadowspire/<env>/lambda-artifacts-bucket), keyed by <sha>.zip.
#   4. Pin the stack's TF_VAR_artifact_key to <sha>.zip and trigger a tracked Spacelift
#      run, blocking on the result so a failed apply fails this job.
#
#   PR / feature branch  -> DEV  (GitHub Environment "dev",        account 176355979099, stack portfolio-backend-dev)
#   push to main         -> PROD (GitHub Environment "production", account 681053994223, stack portfolio-backend-prod)
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ OIDC PREREQUISITE (cross-repo): the `portfolio-deploy` role in each account must      │
# │ trust this repo's OIDC subject (repo:Grimm07/portfolio-backend:environment:dev /      │
# │ :environment:production). It is used HERE only to read the artifact-bucket name from   │
# │ SSM and upload the zip to S3 (the role already has s3:* + /shadowspire SSM read).      │
# │ It is NOT used to apply Terraform — Spacelift's own stack role does the apply.         │
# └─────────────────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # DEV — feature-branch PRs. OIDC sub = repo:Grimm07/portfolio-backend:environment:dev
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy DEV
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      ENV: dev
      AWS_ACCOUNT: "176355979099"
      SPACELIFT_STACK: portfolio-backend-dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC, dev account)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::176355979099:role/portfolio-deploy
          aws-region: us-east-1

      - name: Build contact Lambda bundle (Go arm64 bootstrap)
        working-directory: backend
        run: make build

      - name: Zip bootstrap at zip root, keyed by SHA
        # provided.al2023 requires the executable named `bootstrap` at the ZIP ROOT; -j junks the path.
        run: ( cd backend && zip -j "../$GITHUB_SHA.zip" bootstrap )

      - name: Upload artifact to per-account bucket
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/shadowspire/${ENV}/lambda-artifacts-bucket" \
            --query Parameter.Value --output text)
          aws s3 cp "$GITHUB_SHA.zip" "s3://$BUCKET/$GITHUB_SHA.zip"

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@e92035013ee29ed401c9d35772b3ab2f4c8d12cd # v2.1.0

      - name: Trigger Spacelift deploy (blocks on run result)
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        run: |
          # Pin the artifact key on the stack, then trigger a tracked run.
          #
          # Interleave consideration: TF_VAR_artifact_key is mutable stack env, so in theory two
          # deploys to the SAME stack could race (setvar A, setvar B, deploy A picks up B's key).
          # This is safe here because: (a) Spacelift SERIALIZES tracked runs per stack — the second
          # deploy queues behind the first and re-reads stack env at its own plan time; and
          # (b) GitHub's `concurrency: deploy-${{ github.ref }}` already serializes per ref, and dev
          # vs prod target DISTINCT stacks. `deploy` has no run-scoped --tf-env-var-override (that's
          # local-preview only), so setvar + deploy is the supported mechanism for tracked runs.
          spacectl stack environment setvar \
            --id "$SPACELIFT_STACK" TF_VAR_artifact_key "$GITHUB_SHA.zip"
          # --auto-confirm confirms the tracked run AND tails it; spacectl exits non-zero if the
          # run does not converge, failing this job (no fire-and-forget).
          spacectl stack deploy --id "$SPACELIFT_STACK" --auto-confirm

  # ---------------------------------------------------------------------------
  # PROD — pushes to main. OIDC sub = repo:Grimm07/portfolio-backend:environment:production
  # The "production" environment must require reviewers + restrict to the main branch.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ENV: prod
      AWS_ACCOUNT: "681053994223"
      SPACELIFT_STACK: portfolio-backend-prod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC, prod account)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::681053994223:role/portfolio-deploy
          aws-region: us-east-1

      - name: Build contact Lambda bundle (Go arm64 bootstrap)
        working-directory: backend
        run: make build

      - name: Zip bootstrap at zip root, keyed by SHA
        # provided.al2023 requires the executable named `bootstrap` at the ZIP ROOT; -j junks the path.
        run: ( cd backend && zip -j "../$GITHUB_SHA.zip" bootstrap )

      - name: Upload artifact to per-account bucket
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/shadowspire/${ENV}/lambda-artifacts-bucket" \
            --query Parameter.Value --output text)
          aws s3 cp "$GITHUB_SHA.zip" "s3://$BUCKET/$GITHUB_SHA.zip"

      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@e92035013ee29ed401c9d35772b3ab2f4c8d12cd # v2.1.0

      - name: Trigger Spacelift deploy (blocks on run result)
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ secrets.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
        run: |
          # Pin the artifact key on the stack, then trigger a tracked run.
          #
          # Interleave consideration: TF_VAR_artifact_key is mutable stack env, so in theory two
          # deploys to the SAME stack could race (setvar A, setvar B, deploy A picks up B's key).
          # This is safe here because: (a) Spacelift SERIALIZES tracked runs per stack — the second
          # deploy queues behind the first and re-reads stack env at its own plan time; and
          # (b) GitHub's `concurrency: deploy-${{ github.ref }}` already serializes per ref, and dev
          # vs prod target DISTINCT stacks. `deploy` has no run-scoped --tf-env-var-override (that's
          # local-preview only), so setvar + deploy is the supported mechanism for tracked runs.
          spacectl stack environment setvar \
            --id "$SPACELIFT_STACK" TF_VAR_artifact_key "$GITHUB_SHA.zip"
          # --auto-confirm confirms the tracked run AND tails it; spacectl exits non-zero if the
          # run does not converge, failing this job (no fire-and-forget).
          spacectl stack deploy --id "$SPACELIFT_STACK" --auto-confirm
