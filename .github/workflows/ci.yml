name: CI

# Validation for the contact backend: Go unit tests + vet + gofmt + build, and OpenTofu
# fmt/validate/lint. No AWS credentials are used here (terraform runs with -backend=false).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =============================================================================
  # BACKEND TESTS - the AWS Lambda code (Go; stdlib testing + hand-written fakes).
  # Pinned to Go 1.22 to match backend/go.mod (deps target the go-1.22 SDK line).
  # =============================================================================
  test-backend:
    name: Test Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "unformatted files:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Build arm64 bootstrap (smoke)
        working-directory: backend
        run: make build

  # =============================================================================
  # TERRAFORM VALIDATION - validates the AWS config without a backend.
  # =============================================================================
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.1"

      - name: OpenTofu Format Check
        working-directory: terraform
        run: tofu fmt -check -recursive -diff

      - name: OpenTofu Init (no backend)
        working-directory: terraform
        run: tofu init -backend=false

      - name: OpenTofu Validate
        working-directory: terraform
        run: tofu validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        working-directory: terraform
        run: tflint --init

      - name: Run TFLint
        working-directory: terraform
        run: tflint --format compact
